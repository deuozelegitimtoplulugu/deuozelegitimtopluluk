<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEÜ Özel Eğitim - Giriş & Kayıt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 8px; color: #38bdf8; text-align: center; font-size: 24px; }
    p.sub { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .msg { margin-top: 14px; text-align: center; font-size: 14px; min-height: 20px; }
    .msg.error { color: #f87171; }
    .msg.success { color: #4ade80; }
  </style>

  <!-- Firebase v8 CDN (HTML için en kararlı sürüm) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="card">
    <h2>DEÜ Özel Eğitim</h2>
    <p class="sub">Topluluk Portalı Girişi</p>

    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="ornek: ahmetcan">
    </div>

    <div class="form-group">
      <label for="fullname">Ad Soyad (İlk kayıtta zorunlu)</label>
      <input type="text" id="fullname" placeholder="Adınız Soyadınız">
    </div>

    <div class="form-group">
      <label for="password">Şifre</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="btnAction" onclick="handleAuth()">Giriş Yap / Kaydol</button>
    <div id="statusMsg" class="msg"></div>
  </div>

  <script>
    // Firebase Yapılandırması
    const firebaseConfig = {
      apiKey: "AIzaSyDBuhOWynw0fbuEP1EKSXHCWetRtqlR474",
      authDomain: "deu-ozel-egitim.firebaseapp.com",
      databaseURL: "https://deu-ozel-egitim-default-rtdb.firebaseio.com",
      projectId: "deu-ozel-egitim",
      storageBucket: "deu-ozel-egitim.firebasestorage.app",
      messagingSenderId: "463233621727",
      appId: "1:463233621727:web:4fcbfac218469b1e0e136a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showMsg(text, isError = false) {
      const msg = document.getElementById("statusMsg");
      msg.textContent = text;
      msg.className = "msg " + (isError ? "error" : "success");
    }

    async function handleAuth() {
      const username = document.getElementById("username").value.trim().toLowerCase();
      const fullname = document.getElementById("fullname").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showMsg("Kullanıcı adı ve şifre zorunludur.", true);
        return;
      }

      showMsg("Bağlanıyor...");

      const userRef = db.ref("users/" + username);
      const snapshot = await userRef.once("value");

      if (snapshot.exists()) {
        // Kullanıcı var -> Giriş kontrolü
        const data = snapshot.val();
        if (data.password === password) {
          showMsg("Giriş başarılı! Yönlendiriliyorsunuz...");
          localStorage.setItem("deu_user", JSON.stringify({ username, name: data.name, score: data.score || 0 }));
          setTimeout(() => { window.location.href = "index.html"; }, 1000);
        } else {
          showMsg("Hatalı şifre girdiniz.", true);
        }
      } else {
        // Kullanıcı yok -> Yeni kayıt oluştur
        if (!fullname) {
          showMsg("Yeni üyelik için lütfen Ad Soyad girin.", true);
          return;
        }

        const newUser = {
          name: fullname,
          password: password,
          score: 10, // Başlangıç puanı
          createdAt: new Date().toISOString()
        };

        await userRef.set(newUser);
        showMsg("Kaydınız oluşturuldu! Yönlendiriliyorsunuz...");
        localStorage.setItem("deu_user", JSON.stringify({ username, name: fullname, score: 10 }));
        setTimeout(() => { window.location.href = "index.html"; }, 1000);
      }
    }
  </script>
</body>
</html>
