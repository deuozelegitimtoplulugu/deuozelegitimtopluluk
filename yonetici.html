<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEÜ Özel Eğitim - Yönetici Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 30px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 950px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    h2 { color: #38bdf8; font-size: 22px; }
    .actions a, .actions button { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; cursor: pointer; margin-left: 6px; }
    .actions button:hover, .actions a:hover { background: #475569; color: #fff; }
    
    #notification { display: none; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; text-align: center; font-weight: 500; }
    .notif-success { background: #065f46; color: #6ee7b7; border: 1px solid #059669; }
    .notif-error { background: #881337; color: #fca5a5; border: 1px solid #e11d48; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px 14px; text-align: left; vertical-align: middle; }
    th { color: #94a3b8; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #334155; }
    tr:not(:last-child) td { border-bottom: 1px solid #334155; }
    tr:hover td { background: #243247; }
    
    .current-score { font-size: 15px; font-weight: bold; color: #38bdf8; }
    
    .score-controls { display: flex; align-items: center; gap: 6px; }
    .score-input { width: 80px; padding: 6px 8px; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #fff; text-align: center; font-size: 14px; outline: none; }
    .score-input:focus { border-color: #38bdf8; }
    
    .btn-add { background: #0284c7; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-add:hover { background: #0369a1; }
    .btn-sub { background: #475569; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-sub:hover { background: #64748b; }
    .btn-del { background: #991b1b; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 8px; }
    .btn-del:hover { background: #b91c1c; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div>
        <h2>⚙️ Topluluk Yönetim Paneli</h2>
        <span id="adminInfo" style="color: #94a3b8; font-size: 13px;">Canlı Veritabanı Aktif</span>
      </div>
      <div class="actions">
        <a href="siralama.html" target="_blank">Canlı Sıralama ↗</a>
        <a href="index.html">Ana Sayfa</a>
        <button onclick="logout()">Çıkış Yap</button>
      </div>
    </div>

    <div id="notification"></div>

    <table>
      <thead>
        <tr>
          <th>Kullanıcı Adı</th>
          <th>Ad Soyad</th>
          <th>Mevcut Puan</th>
          <th>Serbest Puan İşlemi</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr><td colspan="5" style="text-align: center; color: #94a3b8;">Veriler yükleniyor...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Yönetici kontrolü
    const user = JSON.parse(localStorage.getItem("deu_user") || "null");
    if (!user || (user.role !== "admin" && user.username !== "admin")) {
      alert("Bu sayfaya yalnızca yöneticiler erişebilir.");
      window.location.href = "giris.html";
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDBuhOWynw0fbuEP1EKSXHCWetRtqlR474",
      authDomain: "deu-ozel-egitim.firebaseapp.com",
      databaseURL: "https://deu-ozel-egitim-default-rtdb.firebaseio.com",
      projectId: "deu-ozel-egitim",
      storageBucket: "deu-ozel-egitim.firebasestorage.app",
      messagingSenderId: "463233621727",
      appId: "1:463233621727:web:4fcbfac218469b1e0e136a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function notify(text, isError = false) {
      const box = document.getElementById("notification");
      box.textContent = text;
      box.className = isError ? "notif-error" : "notif-success";
      box.style.display = "block";
      setTimeout(() => { box.style.display = "none"; }, 3000);
    }

    // Üyeleri canlı çek
    db.ref("users").on("value", (snapshot) => {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";

      if (!snapshot.exists()) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8;">Henüz kayıtlı üye yok.</td></tr>';
        return;
      }

      snapshot.forEach((child) => {
        const u = child.val();
        const username = child.key;
        const currentScore = u.score || 0;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${username}</strong></td>
          <td>${u.name || "-"}</td>
          <td><span class="current-score">${currentScore} Puan</span></td>
          <td>
            <div class="score-controls">
              <input type="number" id="inp_${username}" class="score-input" value="10">
              <button class="btn-add" onclick="modifyScore('${username}', ${currentScore}, true)">+ Ekle</button>
              <button class="btn-sub" onclick="modifyScore('${username}', ${currentScore}, false)">- Düş</button>
            </div>
          </td>
          <td>
            <button class="btn-del" onclick="deleteUser('${username}')">Sil</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }, (err) => {
      notify("Okuma hatası: " + err.message, true);
    });

    // Puan Değiştirme (Hızlı ve Güvenli Update)
    function modifyScore(username, currentScore, isAdd) {
      const inp = document.getElementById("inp_" + username);
      const amount = parseInt(inp.value, 10);

      if (isNaN(amount) || amount <= 0) {
        alert("Lütfen pozitif bir sayı girin.");
        return;
      }

      const newScore = isAdd ? (currentScore + amount) : (currentScore - amount);

      db.ref("users/" + username).update({ score: newScore })
        .then(() => {
          notify(`${username} puanı güncellendi: ${newScore}`);
        })
        .catch((err) => {
          notify("Puan güncellenemedi: " + err.message, true);
        });
    }

    function deleteUser(username) {
      if (confirm(username + " üyesini silmek istediğinize emin misiniz?")) {
        db.ref("users/" + username).remove()
          .then(() => notify(username + " silindi."))
          .catch((err) => notify("Silme hatası: " + err.message, true));
      }
    }

    function logout() {
      localStorage.removeItem("deu_user");
      window.location.href = "giris.html";
    }
  </script>
</body>
</html>
