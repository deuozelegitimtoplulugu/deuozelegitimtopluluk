<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEÜ Özel Eğitim - Yönetici Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 30px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    h2 { color: #38bdf8; font-size: 22px; }
    .actions a, .actions button { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; cursor: pointer; margin-left: 8px; }
    .actions button:hover, .actions a:hover { background: #475569; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px 14px; text-align: left; }
    th { color: #94a3b8; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #334155; }
    tr:not(:last-child) td { border-bottom: 1px solid #334155; }
    tr:hover td { background: #243247; }
    .role-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .role-admin { background: #854d0e; color: #fef08a; }
    .role-member { background: #1e3a5f; color: #93c5fd; }
    .btn-score { background: #0284c7; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
    .btn-score:hover { background: #0369a1; }
    .btn-del { background: #991b1b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-del:hover { background: #b91c1c; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div>
        <h2>⚙️ Topluluk Yönetim Paneli</h2>
        <span id="adminName" style="color: #94a3b8; font-size: 13px;"></span>
      </div>
      <div class="actions">
        <a href="siralama.html">Sıralama</a>
        <a href="index.html">Siteye Dön</a>
        <button onclick="logout()">Çıkış Yap</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Kullanıcı Adı</th>
          <th>Ad Soyad</th>
          <th>Rol</th>
          <th>Mevcut Puan</th>
          <th>İşlemler</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <script>
    // Güvenlik: Admin oturumu yoksa giriş sayfasına yönlendir
    const user = JSON.parse(localStorage.getItem("deu_user") || "null");
    if (!user || user.role !== "admin") {
      alert("Bu sayfaya yalnızca yöneticiler erişebilir.");
      window.location.href = "giris.html";
    } else {
      document.getElementById("adminName").textContent = "Giriş yapan: " + user.name;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDBuhOWynw0fbuEP1EKSXHCWetRtqlR474",
      authDomain: "deu-ozel-egitim.firebaseapp.com",
      databaseURL: "https://deu-ozel-egitim-default-rtdb.firebaseio.com",
      projectId: "deu-ozel-egitim",
      storageBucket: "deu-ozel-egitim.firebasestorage.app",
      messagingSenderId: "463233621727",
      appId: "1:463233621727:web:4fcbfac218469b1e0e136a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Kullanıcıları listele
    db.ref("users").on("value", (snapshot) => {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";

      snapshot.forEach((child) => {
        const u = child.val();
        const username = child.key;
        const role = u.role || "member";
        const score = u.score || 0;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${username}</strong></td>
          <td>${u.name || "-"}</td>
          <td><span class="role-badge ${role === 'admin' ? 'role-admin' : 'role-member'}">${role}</span></td>
          <td>${score} Puan</td>
          <td>
            <button class="btn-score" onclick="changeScore('${username}', 10)">+10 Puan</button>
            <button class="btn-score" onclick="changeScore('${username}', -10)">-10 Puan</button>
            ${role !== 'admin' ? `<button class="btn-del" onclick="deleteUser('${username}')">Sil</button>` : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    });

    function changeScore(username, delta) {
      db.ref("users/" + username + "/score").transaction((current) => {
        return (current || 0) + delta;
      });
    }

    function deleteUser(username) {
      if (confirm(username + " kullanıcısını silmek istediğinize emin misiniz?")) {
        db.ref("users/" + username).remove();
      }
    }

    function logout() {
      localStorage.removeItem("deu_user");
      window.location.href = "giris.html";
    }
  </script>
</body>
</html>
