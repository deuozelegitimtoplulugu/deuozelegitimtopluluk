<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEÜ Özel Eğitim - Liderlik Sıralaması</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 32px 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 700px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    h2 { color: #38bdf8; font-size: 22px; }
    a.btn-back { color: #94a3b8; text-decoration: none; font-size: 14px; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; }
    a.btn-back:hover { color: #fff; border-color: #94a3b8; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px 14px; }
    th { color: #94a3b8; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #334155; }
    tr:not(:last-child) td { border-bottom: 1px solid #334155; }
    tr:hover td { background: #243247; }
    .rank { font-weight: bold; width: 40px; color: #cbd5e1; }
    .rank-1 { color: #facc15; }
    .rank-2 { color: #cbd5e1; }
    .rank-3 { color: #f97316; }
    .score-badge { background: #0369a1; color: #e0f2fe; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 13px; }
    .loading { text-align: center; color: #94a3b8; padding: 24px; font-size: 15px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>🏆 Topluluk Sıralaması</h2>
      <a href="index.html" class="btn-back">Ana Sayfa</a>
    </div>

    <div id="loader" class="loading">Veriler yükleniyor...</div>

    <table id="rankTable" style="display: none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Üye</th>
          <th>Puan</th>
        </tr>
      </thead>
      <tbody id="rankBody"></tbody>
    </table>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDBuhOWynw0fbuEP1EKSXHCWetRtqlR474",
      authDomain: "deu-ozel-egitim.firebaseapp.com",
      databaseURL: "https://deu-ozel-egitim-default-rtdb.firebaseio.com",
      projectId: "deu-ozel-egitim",
      storageBucket: "deu-ozel-egitim.firebasestorage.app",
      messagingSenderId: "463233621727",
      appId: "1:463233621727:web:4fcbfac218469b1e0e136a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Veriler değiştikçe otomatik tetiklenir (Real-time listener)
    db.ref("users").on("value", (snapshot) => {
      const tbody = document.getElementById("rankBody");
      tbody.innerHTML = "";

      const users = [];
      snapshot.forEach((child) => {
        users.push({
          username: child.key,
          ...child.val()
        });
      });

      // Puanlara göre yüksekten düşüğe sırala
      users.sort((a, b) => (b.score || 0) - (a.score || 0));

      users.forEach((u, index) => {
        const row = document.createElement("tr");
        const rankClass = index === 0 ? "rank-1" : (index === 1 ? "rank-2" : (index === 2 ? "rank-3" : ""));
        
        row.innerHTML = `
          <td class="rank ${rankClass}">${index + 1}</td>
          <td><strong>${u.name || u.username}</strong></td>
          <td><span class="score-badge">${u.score || 0} Puan</span></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById("loader").style.display = "none";
      document.getElementById("rankTable").style.display = "table";
    });
  </script>
</body>
</html>
