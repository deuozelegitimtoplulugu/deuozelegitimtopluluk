<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEÜ Özel Eğitim Topluluğu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
    
    /* Navbar */
    .navbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { font-size: 18px; font-weight: 700; color: #38bdf8; text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 12px; position: relative; }
    
    /* Giriş / Profil Rozeti */
    .btn-login { background: #0284c7; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; }
    .user-pill { display: flex; align-items: center; background: #0f172a; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; gap: 8px; }
    .user-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .user-role-badge { font-size: 11px; background: #854d0e; color: #fef08a; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    .dots-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .dots-btn:hover { color: #fff; }

    /* 3 Nokta Menüsü */
    .dropdown { display: none; position: absolute; right: 0; top: 120%; width: 220px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 200; }
    .dropdown.show { display: block; }
    .dropdown a, .dropdown button { display: block; width: 100%; text-align: left; padding: 9px 12px; font-size: 13px; color: #cbd5e1; text-decoration: none; background: none; border: none; border-radius: 4px; cursor: pointer; }
    .dropdown a:hover, .dropdown button:hover { background: #334155; color: #fff; }
    .admin-action { color: #facc15 !important; font-weight: 600; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 4px; }
    .btn-logout { color: #f87171 !important; border-top: 1px solid #334155; margin-top: 4px; padding-top: 8px; }

    /* İçerik Alanı */
    .hero { max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center; }
    .hero h1 { font-size: 32px; color: #38bdf8; margin-bottom: 12px; }
    .hero p { color: #94a3b8; font-size: 16px; margin-bottom: 24px; }
    .btn-action { display: inline-block; background: #0284c7; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; }

    /* Yönetici Puan Modal Penceresi */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { color: #facc15; font-size: 18px; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 16px 20px; overflow-y: auto; }
    .score-table { width: 100%; border-collapse: collapse; }
    .score-table th, .score-table td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
    .score-table th { color: #94a3b8; text-transform: uppercase; font-size: 11px; }
    .score-inp { width: 60px; padding: 5px; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #fff; text-align: center; }
    .btn-mod { border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-add { background: #0284c7; color: #fff; }
    .btn-sub { background: #475569; color: #fff; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Ortak Navbar -->
  <nav class="navbar">
    <a href="index.html" class="brand">DEÜ Özel Eğitim</a>
    <div class="nav-right" id="navAuthArea">
      <!-- Kullanıcı durumuna göre buton veya 3 nokta menüsü gelecek -->
    </div>
  </nav>

  <!-- Ana Sayfa İçeriği -->
  <main class="hero">
    <h1>Topluluk Portalı</h1>
    <p>Etkinlikler, puanlama sistemi ve güncel duyurular.</p>
    <a href="siralama.html" class="btn-action">🏆 Canlı Sıralamaya Git</a>
  </main>

  <!-- Sadece Yöneticinin 3 Noktasından Açılan Puan Düzenleme Penceresi -->
  <div id="scoreModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚡ Üye Puanlarını Güncelle</h3>
        <button class="modal-close" onclick="closeScoreModal()">&times;</button>
      </div>
      <div class="modal-body">
        <table class="score-table">
          <thead>
            <tr>
              <th>Üye</th>
              <th>Mevcut Puan</th>
              <th>Puan Değiştir</th>
            </tr>
          </thead>
          <tbody id="modalUserList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDBuhOWynw0fbuEP1EKSXHCWetRtqlR474",
      authDomain: "deu-ozel-egitim.firebaseapp.com",
      databaseURL: "https://deu-ozel-egitim-default-rtdb.firebaseio.com",
      projectId: "deu-ozel-egitim",
      storageBucket: "deu-ozel-egitim.firebasestorage.app",
      messagingSenderId: "463233621727",
      appId: "1:463233621727:web:4fcbfac218469b1e0e136a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Navbardaki Durumu Çiz (Giriş Yapıldı mı / Yönetici mi?)
    function renderNav() {
      const navArea = document.getElementById("navAuthArea");
      const userStr = localStorage.getItem("deu_user");

      if (!userStr) {
        navArea.innerHTML = `<a href="giris.html" class="btn-login">Giriş Yap</a>`;
        return;
      }

      const user = JSON.parse(userStr);
      const isAdmin = (user.role === "admin" || user.username === "admin");

      navArea.innerHTML = `
        <div class="user-pill">
          <span class="user-name">${user.name || user.username}</span>
          ${isAdmin ? '<span class="user-role-badge">YÖNETİCİ</span>' : ''}
          <button class="dots-btn" onclick="toggleMenu(event)">⋮</button>
        </div>

        <div id="userMenu" class="dropdown">
          <a href="siralama.html">🏆 Sıralama</a>
          ${isAdmin ? '<button class="admin-action" onclick="openScoreModal()">⚡ Puan Ekle / Çıkart</button>' : ''}
          <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
        </div>
      `;
    }

    function toggleMenu(e) {
      e.stopPropagation();
      document.getElementById("userMenu").classList.toggle("show");
    }

    window.addEventListener("click", () => {
      const m = document.getElementById("userMenu");
      if (m) m.classList.remove("show");
    });

    function logout() {
      localStorage.removeItem("deu_user");
      window.location.reload();
    }

    // Modal Aç/Kapat
    function openScoreModal() {
      document.getElementById("scoreModal").classList.add("open");
      loadUsersToModal();
    }
    function closeScoreModal() {
      document.getElementById("scoreModal").classList.remove("open");
    }

    // Puanları Listele ve Değiştir
    function loadUsersToModal() {
      db.ref("users").on("value", (snap) => {
        const tbody = document.getElementById("modalUserList");
        tbody.innerHTML = "";

        snap.forEach((child) => {
          const u = child.val();
          const uname = child.key;
          const score = u.score || 0;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${u.name || uname}</strong><br><small style="color:#64748b">@${uname}</small></td>
            <td style="color:#38bdf8; font-weight:bold;">${score} P</td>
            <td>
              <div style="display:flex; gap:6px; align-items:center;">
                <input type="number" id="mod_${uname}" class="score-inp" value="10">
                <button class="btn-mod btn-add" onclick="updatePoints('${uname}', ${score}, true)">+ Ekle</button>
                <button class="btn-mod btn-sub" onclick="updatePoints('${uname}', ${score}, false)">- Düş</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function updatePoints(username, curScore, isAdd) {
      const inp = document.getElementById("mod_" + username);
      const val = parseInt(inp.value, 10);
      if (isNaN(val) || val <= 0) return alert("Geçerli bir sayı girin.");
      const newScore = isAdd ? (curScore + val) : (curScore - val);

      db.ref("users/" + username).update({ score: newScore });
    }

    document.addEventListener("DOMContentLoaded", renderNav);
  </script>
</body>
</html>
