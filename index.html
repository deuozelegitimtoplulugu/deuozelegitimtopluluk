<!-- NAV ÇUBUĞU SAĞ KISIM (Giriş / Profil Alanı) -->
<div id="authArea" style="position: relative; display: flex; align-items: center; gap: 10px;">
  <!-- JS otomatik dolduracak -->
</div>

<style>
  .user-badge-container { display: flex; align-items: center; background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; gap: 8px; color: #fff; }
  .user-badge-name { font-weight: 600; font-size: 14px; color: #38bdf8; }
  .user-badge-score { background: #0284c7; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  .three-dots-btn { background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .three-dots-btn:hover { color: #fff; }
  
  .profile-dropdown { display: none; position: absolute; right: 0; top: 120%; width: 200px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; }
  .profile-dropdown.active { display: block; }
  .profile-dropdown a, .profile-dropdown button { display: block; width: 100%; text-align: left; padding: 8px 10px; font-size: 13px; color: #cbd5e1; text-decoration: none; background: none; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 4px; }
  .profile-dropdown a:hover, .profile-dropdown button:hover { background: #334155; color: #fff; }
  .profile-dropdown button.btn-logout { color: #f87171; border-top: 1px solid #334155; margin-top: 6px; padding-top: 10px; }
  .profile-dropdown button.btn-logout:hover { background: #450a0a; color: #fca5a5; }

  .login-btn-link { background: #0284c7; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; transition: 0.2s; }
  .login-btn-link:hover { background: #0369a1; }
</style>

<script>
  function renderAuthUI() {
    const authArea = document.getElementById("authArea");
    if (!authArea) return;

    const userStr = localStorage.getItem("deu_user");
    if (!userStr) {
      // Giriş yapılmamışsa buton göster
      authArea.innerHTML = `<a href="giris.html" class="login-btn-link">Giriş Yap</a>`;
      return;
    }

    const user = JSON.parse(userStr);
    authArea.innerHTML = `
      <div class="user-badge-container">
        <span class="user-badge-name">${user.name || user.username}</span>
        <span class="user-badge-score">${user.score || 0} P</span>
        <button class="three-dots-btn" onclick="toggleDropdown(event)">⋮</button>
      </div>

      <div id="profileDropdown" class="profile-dropdown">
        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase;">Hesabım (@${user.username})</div>
        <a href="siralama.html">🏆 Canlı Sıralama</a>
        ${user.role === 'admin' ? '<a href="yonetici.html" style="color: #facc15; font-weight: 600;">⚙️ Yönetici Paneli</a>' : ''}
        <button class="btn-logout" onclick="userLogout()">Çıkış Yap</button>
      </div>
    `;
  }

  function toggleDropdown(e) {
    e.stopPropagation();
    const dropdown = document.getElementById("profileDropdown");
    if (dropdown) dropdown.classList.toggle("active");
  }

  window.addEventListener("click", () => {
    const dropdown = document.getElementById("profileDropdown");
    if (dropdown) dropdown.classList.remove("active");
  });

  function userLogout() {
    localStorage.removeItem("deu_user");
    renderAuthUI();
    window.location.reload();
  }

  document.addEventListener("DOMContentLoaded", renderAuthUI);
</script>
